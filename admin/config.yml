backend:
  name: github
  repo: erasmdif/TlTr          # <-- usa l'owner/repo reali del sito che stai aprendo
  branch: main
  auth_type: token             # login con PAT incollato nel browser

site_url: https://erasmdif.github.io/TlTr

publish_mode: editorial_workflow   # se vuoi PR; per commit diretti: simple

media_folder: "static/uploads"
public_folder: "/static/uploads"

locale: "it"

collections:
  - name: "homepage"
    label: "Avvisi Homepage"
    files:
      - file: "static/moduli/info/info_homepage.txt"
        name: "info_homepage"
        label: "Avvisi Homepage"
        editor:
          preview: false          # nessuna anteprima live (più snello)
        fields:
          - label: "Contenuto"
            name: "body"
            widget: "markdown"
            buttons: [bold, italic, link, bulleted-list, numbered-list, code, quote]
            # NB: questi componenti vengono registrati in admin/index.html
            editor_components: [highlight, moda, invisiblelink]
