backend:
  name: github
  repo: erasmdif/TlTr
  branch: main
  auth_type: token      # token PAT, niente Netlify / OAuth

media_folder: "static/uploads"
public_folder: "/TlTr/static/uploads"

publish_mode: editorial_workflow

collections:
  - name: homepage
    label: "Avvisi Homepage"
    files:
      - file: "static/moduli/info/info_homepage.txt"
        label: "Info Homepage"
        name: info_homepage
        editor:
          preview: false
        fields:
          - label: Contenuto
            name: body
            widget: markdown
            buttons: [bold, italic, link, bulleted-list, numbered-list, code, heading-one, heading-two, quote]
