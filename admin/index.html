<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Editor Avvisi</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Dì a Decap di NON auto-inizializzare -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.10/dist/decap-cms.js"></script>

    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .Pane.Pane1 { min-width: 320px; }
      .nc-loginPage-logo { display:none; }
    </style>
  </head>
  <body>
    <script>
      function initCMS() {
        const CMS = window.CMS;

        // ============= Componenti custom =============
        // 1) Evidenza: !!testo!!
        CMS.registerEditorComponent({
          id: "highlight",
          label: "Evidenzia (!!)",
          fields: [{ name: "text", label: "Testo", widget: "string" }],
          pattern: /!!(.+?)!!/s,
          fromBlock: m => ({ text: m[1] }),
          toBlock: o => `!!${o.text}!!`,
          toPreview: o =>
            `<span style="background:#ffe0b2;padding:0 .2em;border-radius:.2em">${CMS.escapeHtml(o.text)}</span>`
        });

        // 2) Link Modulo A: [[modA|etichetta]]
        CMS.registerEditorComponent({
          id: "moda",
          label: "Link Modulo A",
          fields: [{ name: "label", label: "Etichetta", widget: "string", default: "vedi Info Modulo A" }],
          pattern: /\[\[modA\|([^\]]+)\]\]/,
          fromBlock: m => ({ label: m[1] }),
          toBlock: o => `[[modA|${o.label || "vedi Info Modulo A"}]]`,
          toPreview: o => `<em>Link Modulo A: ${CMS.escapeHtml(o.label || "vedi Info Modulo A")}</em>`
        });

        // 3) Link invisibile: ((https://...))
        CMS.registerEditorComponent({
          id: "invisiblelink",
          label: "Link Invisibile",
          fields: [{ name: "url", label: "URL", widget: "string" }],
          pattern: /\(\((https?:\/\/[^\s)]+)\)\)/,
          fromBlock: m => ({ url: m[1] }),
          toBlock: o => `((${o.url}))`,
          toPreview: o => `<span style="opacity:.6">🔗 ${CMS.escapeHtml(o.url)}</span>`
        });

        // NIENTE registerPreviewStyle qui: la preview è disattivata nel config.yml (preview:false)

        // Inizializza Decap (legge automaticamente /admin/config.yml)
        CMS.init();
      }

      // Assicurati che Decap sia caricato prima di registrare i componenti
      if (window.CMS) {
        initCMS();
      } else {
        window.addEventListener('load', initCMS);
      }
    </script>
  </body>
</html>
