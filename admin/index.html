<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Editor Avvisi</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- ✅ Config INLINE: niente fetch di admin/config.yml -->
    <script id="decap-cms-config" type="application/json">
    {
      "backend": {
        "name": "github",
        "repo": "erasmdif/TlTr",
        "branch": "main",
        "auth_type": "token"
      },
      "media_folder": "static/uploads",
      "public_folder": "/TlTr/static/uploads",
      "publish_mode": "editorial_workflow",
      "collections": [
        {
          "name": "homepage",
          "label": "Avvisi Homepage",
          "files": [
            {
              "file": "static/moduli/info/info_homepage.txt",
              "label": "Info Homepage",
              "name": "info_homepage",
              "editor": { "preview": false },
              "fields": [
                {
                  "label": "Contenuto",
                  "name": "body",
                  "widget": "markdown",
                  "buttons": [
                    "bold","italic","link",
                    "bulleted-list","numbered-list",
                    "code","heading-one","heading-two","quote"
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
    </script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.3.0/dist/decap-cms.js"></script>

    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .Pane.Pane1 { min-width: 320px; }
      .nc-loginPage-logo { display:none; }
    </style>
  </head>
  <body>
    <script>
      // Registrazioni dopo il load della libreria
      window.addEventListener('load', function () {
        // Piccolo aiuto nella schermata token
        CMS.registerPreviewStyle(`
          .nc-githubAuthenticationPage-token .nc-githubAuthenticationPage-info::after{
            content: "Usa un PAT fine-grained con 'Contents: Read/Write' sul repo erasmdif/TlTr e incollalo qui.";
            display:block; margin-top:.5rem; font-size:.9em; color:#555;
          }
        `, { raw: true });

        // Componenti custom: evidenzia
        CMS.registerEditorComponent({
          id: "highlight",
          label: "Evidenzia (!!)",
          fields: [{ name: "text", label: "Testo", widget: "string" }],
          pattern: /!!(.+?)!!/s,
          fromBlock: m => ({ text: m[1] }),
          toBlock: o => `!!${o.text}!!`,
          toPreview: o => `<span style="background:#ffe0b2;padding:0 .2em;border-radius:.2em">${CMS.escapeHtml(o.text)}</span>`
        });

        // Link Modulo A
        CMS.registerEditorComponent({
          id: "moda",
          label: "Link Modulo A",
          fields: [{ name: "label", label: "Etichetta", widget: "string", default: "vedi Info Modulo A" }],
          pattern: /\[\[modA\|([^\]]+)\]\]/,
          fromBlock: m => ({ label: m[1] }),
          toBlock: o => `[[modA|${o.label || "vedi Info Modulo A"}]]`,
          toPreview: o => `<em>Link Modulo A: ${CMS.escapeHtml(o.label || "vedi Info Modulo A")}</em>`
        });

        // Link invisibile ((https://...))
        CMS.registerEditorComponent({
          id: "invisiblelink",
          label: "Link Invisibile",
          fields: [{ name: "url", label: "URL", widget: "string" }],
          pattern: /\(\((https?:\/\/[^\s)]+)\)\)/,
          fromBlock: m => ({ url: m[1] }),
          toBlock: o => `((${o.url}))`,
          toPreview: o => `<span style="opacity:.6">🔗 ${CMS.escapeHtml(o.url)}</span>`
        });

        console.log("[Decap] Auto-init con config inline:", CMS.getConfig()?.toJS?.());
      });
    </script>
  </body>
</html>
